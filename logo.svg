<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    
    <!-- UserSpaceOnUse filter with full canvas bounds to eliminate clipping -->
    <filter id="neonGlow" filterUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <feGaussianBlur stdDeviation="8" result="blurWide" />
      <feGaussianBlur stdDeviation="3" result="blurTight" />
      <feMerge>
        <feMergeNode in="blurWide" />
        <feMergeNode in="blurTight" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4.5" />
  
  <!-- Ambient Center Soft Glow -->
  <circle cx="64" cy="64" r="40" fill="#38bdf8" opacity="0.15" filter="blur(20px)" />

  <!-- Multi-layered Smooth Unclipped Neon Tilde Wave -->
  <!-- Layer 1: Soft Outer Neon Diffusion -->
  <path d="M 28 68 C 24 38, 48 34, 64 56 C 80 78, 104 74, 100 44" 
        fill="none" 
        stroke="url(#waveGrad)" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.25"
        filter="url(#neonGlow)" />

  <!-- Layer 2: Main Crisp Electric Core -->
  <path d="M 28 68 C 24 38, 48 34, 64 56 C 80 78, 104 74, 100 44" 
        fill="none" 
        stroke="url(#waveGrad)" 
        stroke-width="15" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neonGlow)" />
</svg>
