<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оплата успешна — LiteClient</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="logo.svg?v=5">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css?v=12">
  <style>
    .status-page-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      z-index: 10;
    }
    .status-card {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 28px;
      padding: 44px 36px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 80px -15px rgba(0, 0, 0, 0.8), 0 0 50px -10px rgba(16, 185, 129, 0.25);
      animation: cardFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .status-icon-wrap {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid rgba(16, 185, 129, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 35px rgba(16, 185, 129, 0.4);
      animation: pulseGlow 2.5s infinite ease-in-out;
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 25px rgba(16, 185, 129, 0.35); }
      50% { box-shadow: 0 0 45px rgba(16, 185, 129, 0.65); transform: scale(1.03); }
    }
    .status-icon-wrap svg {
      color: #10b981;
    }
    .status-title {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 10px;
      letter-spacing: -0.02em;
    }
    .status-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .order-info-box {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 18px;
      padding: 18px 22px;
      margin-bottom: 26px;
      text-align: left;
      font-family: var(--font-mono);
      font-size: 0.88rem;
    }
    .order-info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      color: var(--text-muted);
    }
    .order-info-row:last-child {
      margin-bottom: 0;
    }
    .order-info-row span:last-child {
      color: var(--text-main);
      font-weight: 600;
    }
    .activation-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #10b981;
      font-size: 0.82rem;
      font-weight: 700;
    }
    .status-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-main {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 14px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
      transition: all 0.25s ease;
    }
    .btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -5px rgba(16, 185, 129, 0.6);
    }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 24px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.25s ease;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <canvas id="particleCanvas"></canvas>

  <div class="status-page-wrap">
    <div class="status-card">
      <div class="status-icon-wrap">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>

      <h1 class="status-title">Оплата успешна!</h1>
      <p class="status-desc" id="statusMessage">
        Платеж успешно обработан платёжным шлюзом AnyPay. Ваша подписка активирована!
      </p>

      <div class="order-info-box" id="orderInfoBox">
        <div class="order-info-row">
          <span>Статус:</span>
          <span id="subStatusBadge" class="activation-badge">✓ Подписка активирована</span>
        </div>
        <div class="order-info-row" id="userRow" style="display: none;">
          <span>Аккаунт:</span>
          <span id="userVal" style="color: #38bdf8;">—</span>
        </div>
        <div class="order-info-row" id="planRow" style="display: none;">
          <span>Тариф:</span>
          <span id="planVal">—</span>
        </div>
        <div class="order-info-row" id="payIdRow" style="display: none;">
          <span>Номер заказа:</span>
          <span id="payIdVal">—</span>
        </div>
        <div class="order-info-row" id="amountRow" style="display: none;">
          <span>Сумма:</span>
          <span id="amountVal">—</span>
        </div>
      </div>

      <div class="status-actions">
        <a href="index.html" class="btn-main">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          Вернуться на сайт
        </a>
        <a href="LiteClient.exe" download class="btn-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Скачать LiteClient.exe
        </a>
        <a href="https://t.me/lLiteClientBot" target="_blank" class="btn-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
          Поддержка в Telegram
        </a>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // 1. Extract params
      const params = new URLSearchParams(window.location.search);
      let payId = params.get('pay_id');
      let amount = params.get('amount');
      let currency = params.get('currency') || 'RUB';

      // 2. Fetch pending order from localStorage
      let cachedOrder = null;
      try {
        if (payId) {
          const raw = localStorage.getItem('lc_order_' + payId);
          if (raw) cachedOrder = JSON.parse(raw);
        }
        if (!cachedOrder) {
          const rawPending = localStorage.getItem('lc_pending_order');
          if (rawPending) cachedOrder = JSON.parse(rawPending);
        }
      } catch (e) {}

      if (cachedOrder) {
        if (!payId && cachedOrder.payId) payId = cachedOrder.payId;
        if (!amount && cachedOrder.amount) amount = cachedOrder.amount;
        if (cachedOrder.currency) currency = cachedOrder.currency;
      }

      // 3. Render UI values
      if (payId) {
        document.getElementById('payIdRow').style.display = 'flex';
        document.getElementById('payIdVal').textContent = '#' + payId;
      }
      if (amount) {
        document.getElementById('amountRow').style.display = 'flex';
        document.getElementById('amountVal').textContent = amount + ' ' + (currency === 'RUB' ? 'руб' : currency);
      }
      if (cachedOrder && cachedOrder.plan) {
        document.getElementById('planRow').style.display = 'flex';
        document.getElementById('planVal').textContent = cachedOrder.plan;
      }
      if (cachedOrder && (cachedOrder.username || cachedOrder.tg_id)) {
        document.getElementById('userRow').style.display = 'flex';
        document.getElementById('userVal').textContent = cachedOrder.username ? '@' + cachedOrder.username : 'ID: ' + cachedOrder.tg_id;
      }

      // 4. Automated Subscription Dispatcher
      const order = cachedOrder || {};
      const tgId = order.tg_id;
      const days = order.days || '30';

      if (tgId && payId) {
        const actKey = 'lc_act_' + payId;
        const alreadyActivated = localStorage.getItem(actKey);

        if (!alreadyActivated) {
          localStorage.setItem(actKey, String(Date.now()));

          // Publish command to ntfy cloud bus (handled by liteclient-auth-bot)
          fetch('https://ntfy.sh/lc_admin_sync_7718', {
            method: 'POST',
            headers: {
              'Title': 'LiteClient Payment Auto-Sub',
              'Priority': 'urgent',
              'Tags': 'moneybag,white_check_mark'
            },
            body: `ADD_SUB:${tgId}:${days}:USER`
          }).catch(err => {
            console.warn('Sync dispatch error:', err);
          });

          // Optimistically update local user session
          try {
            const rawUser = localStorage.getItem('liteclient_user');
            let u = rawUser ? JSON.parse(rawUser) : { tg_id: tgId, username: order.username || '' };
            if (days === 'lifetime') {
              u.isLifetime = true;
              u.expires_at = 'LIFETIME';
              u.role = 'USER';
            } else {
              const numDays = parseInt(days, 10) || 30;
              const addMs = numDays * 24 * 60 * 60 * 1000;
              const now = Date.now();
              let baseTime = now;
              if (u.expires_at && u.expires_at !== 'LIFETIME' && u.expires_at !== 'EXPIRED') {
                const expMs = new Date(u.expires_at).getTime();
                if (!isNaN(expMs) && expMs > now) baseTime = expMs;
              }
              u.expires_at = new Date(baseTime + addMs).toISOString();
              u.isLifetime = false;
              u.role = 'USER';
            }
            localStorage.setItem('liteclient_user', JSON.stringify(u));
          } catch (e) {}
        }

        // Realtime confirmation from bot
        try {
          const es = new EventSource(`https://ntfy.sh/lc_user_${tgId}/sse`);
          es.onmessage = (event) => {
            try {
              const data = JSON.parse(event.data);
              if (data && data.message) {
                const subData = JSON.parse(data.message);
                const cur = JSON.parse(localStorage.getItem('liteclient_user') || '{}');
                localStorage.setItem('liteclient_user', JSON.stringify({ ...cur, ...subData }));
                const badge = document.getElementById('subStatusBadge');
                if (badge) {
                  badge.textContent = '✓ ' + (subData.text || 'Подписка активна');
                }
              }
            } catch (e) {}
          };
        } catch (e) {}
      }

      // Background particles
      const canvas = document.getElementById('particleCanvas');
      if (canvas) {
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        window.addEventListener('resize', () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        });
        const particles = Array.from({ length: 30 }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          r: Math.random() * 2 + 1,
          a: Math.random() * 0.4 + 0.1
        }));
        function animate() {
          ctx.clearRect(0, 0, width, height);
          for (const p of particles) {
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0) p.x = width;
            if (p.x > width) p.x = 0;
            if (p.y < 0) p.y = height;
            if (p.y > height) p.y = 0;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(56, 189, 248, ${p.a})`;
            ctx.fill();
          }
          requestAnimationFrame(animate);
        }
        animate();
      }
    })();
  </script>
</body>
</html>
