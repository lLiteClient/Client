<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оплата успешна — LiteClient</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="logo.svg?v=5">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="stylesheet" href="styles.css?v=12">
  <style>
    .status-page-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      z-index: 10;
    }
    .status-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 28px;
      padding: 48px 36px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 80px -15px rgba(0, 0, 0, 0.8), 0 0 50px -10px rgba(16, 185, 129, 0.25);
      animation: cardFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .status-icon-wrap {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid rgba(16, 185, 129, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.35);
    }
    .status-icon-wrap svg {
      color: #10b981;
    }
    .status-title {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }
    .status-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .order-info-box {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 28px;
      text-align: left;
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }
    .order-info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: var(--text-muted);
    }
    .order-info-row:last-child {
      margin-bottom: 0;
    }
    .order-info-row span:last-child {
      color: var(--text-main);
      font-weight: 600;
    }
    .status-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-main {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 14px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      text-decoration: none;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.4);
      transition: all 0.25s ease;
    }
    .btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px -5px rgba(16, 185, 129, 0.6);
    }
    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 24px;
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.25s ease;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <canvas id="particleCanvas"></canvas>

  <div class="status-page-wrap">
    <div class="status-card">
      <div class="status-icon-wrap">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>

      <h1 class="status-title">Оплата успешна!</h1>
      <p class="status-desc">
        Спасибо за покупку! Платеж успешно обработан платёжным шлюзом. Подписка в LiteClient активируется автоматически в течение 1-2 минут.
      </p>

      <div class="order-info-box" id="orderInfoBox">
        <div class="order-info-row">
          <span>Статус:</span>
          <span style="color: #10b981;">✓ Оплачено</span>
        </div>
        <div class="order-info-row" id="payIdRow" style="display: none;">
          <span>Номер заказа:</span>
          <span id="payIdVal">—</span>
        </div>
        <div class="order-info-row" id="amountRow" style="display: none;">
          <span>Сумма:</span>
          <span id="amountVal">—</span>
        </div>
      </div>

      <div class="status-actions">
        <a href="index.html" class="btn-main">
          Вернуться на сайт
        </a>
        <a href="https://t.me/lLiteClientBot" target="_blank" class="btn-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
          Открыть Telegram бота
        </a>
        <a href="LiteClient.exe" download class="btn-secondary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          Скачать LiteClient.exe
        </a>
      </div>
    </div>
  </div>

  <script>
    // Extract query parameters if AnyPay passes them (pay_id, amount, currency)
    const params = new URLSearchParams(window.location.search);
    const payId = params.get('pay_id');
    const amount = params.get('amount');
    const currency = params.get('currency') || 'RUB';

    if (payId) {
      document.getElementById('payIdRow').style.display = 'flex';
      document.getElementById('payIdVal').textContent = '#' + payId;
    }
    if (amount) {
      document.getElementById('amountRow').style.display = 'flex';
      document.getElementById('amountVal').textContent = amount + ' ' + (currency === 'RUB' ? 'руб' : currency);
    }
  </script>
</body>
</html>
